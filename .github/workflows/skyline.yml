name: Generate skyline metrics

on:
  schedule: # setiap 12 jam
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub Skyline
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.plugin.skyline.svg
          token: NOT_NEEDED
          base: ""
          output_action: none
          config_timezone: Asia/Jakarta
          plugin_skyline: yes
          plugin_skyline_frames: 60
          plugin_skyline_quality: 1

      - name: Push skyline.svg to skyline-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: skyline-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
